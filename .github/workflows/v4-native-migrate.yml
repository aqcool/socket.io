name: V4 Native Migration

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: v4-native-migration-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  migrate:
    if: ${{ github.event.pull_request.head.ref == 'feat/v4-native-core' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout migration branch
        uses: actions/checkout@v6
        with:
          ref: feat/v4-native-core
          fetch-depth: 0

      - name: Skip completed migration
        id: marker
        shell: bash
        run: |
          if [ -f .native-v4-migrated ]; then
            echo "done=true" >> "$GITHUB_OUTPUT"
          else
            echo "done=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.marker.outputs.done != 'true'
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Apply native v4 migration
        if: steps.marker.outputs.done != 'true'
        run: python3 .github/scripts/native_v4_migrate.py

      - name: Format Go sources
        if: steps.marker.outputs.done != 'true'
        run: |
          find . -type f -name '*.go' \
            -not -path './vendor/*' \
            -not -path '*/vendor/*' \
            -print0 | xargs -0 gofmt -w

      - name: Wire local module graph
        if: steps.marker.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t mods < <(find . -name go.mod -not -path '*/vendor/*' | sort)
          declare -a module_names=()
          declare -a module_dirs=()
          for mod in "${mods[@]}"; do
            dir=$(dirname "$mod")
            name=$(awk '/^module / {print $2; exit}' "$mod")
            if [[ "$name" == github.com/aqcool/socket.io* ]]; then
              module_names+=("$name")
              module_dirs+=("$dir")
            fi
          done

          for mod in "${mods[@]}"; do
            dir=$(dirname "$mod")
            for i in "${!module_names[@]}"; do
              target=${module_dirs[$i]}
              [[ "$dir" == "$target" ]] && continue
              rel=$(realpath --relative-to="$dir" "$target")
              if [[ "$rel" != .* ]]; then
                rel="./$rel"
              fi
              (cd "$dir" && go mod edit -replace="${module_names[$i]}=$rel")
            done
          done

      - name: Tidy modules
        if: steps.marker.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          while IFS= read -r mod; do
            dir=$(dirname "$mod")
            echo "tidy: $dir"
            (cd "$dir" && go mod tidy)
          done < <(find . -name go.mod -not -path '*/vendor/*' | sort)

      - name: Smoke compile native root
        if: steps.marker.outputs.done != 'true'
        run: go test -run '^$' ./...

      - name: Commit migration
        if: steps.marker.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No migration changes"
            exit 0
          fi
          git commit -m "chore(v4): apply native module migration"
          git push origin HEAD:feat/v4-native-core
